[project]
name = "duckdb-notebook"
version = "0.1.0"
description = "Explore arbitrary Parquet schemas and query data with DuckDB in Jupyter"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "pandas>=2.2,<4",
    "pytz>=2024.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
]

[tool.uv]
package = false
